quarkus.http.port=8082
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=ecommerce
quarkus.datasource.password=ecommerce
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5435/payment_db
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=none
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{2.}] [correlation=%X{correlationId}] %s%e%n
kafka.bootstrap.servers=localhost:9092
mp.messaging.incoming.inventory-events-payment.connector=smallrye-kafka
mp.messaging.incoming.inventory-events-payment.topic=inventory-events
mp.messaging.incoming.inventory-events-payment.group.id=payment-service
mp.messaging.incoming.inventory-events-payment.auto.offset.reset=earliest
mp.messaging.incoming.inventory-events-payment.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
quarkus.rest-client.payment-provider.url=http://localhost:8082
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:payment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.mp.messaging.incoming.inventory-events-payment.connector=smallrye-in-memory
%test.quarkus.kafka.devservices.enabled=false
%test.quarkus.http.test-port=8087
%test.quarkus.rest-client.payment-provider.url=http://localhost:8087
